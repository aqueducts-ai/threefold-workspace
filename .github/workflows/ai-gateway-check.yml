# No new direct LLM calls: every LLM call goes through the Vercel AI Gateway with a per-feature key.
# Rule: .claude/rules/ai-gateway.md. Scanner: scripts/check-direct-ai-calls.mjs (vendored, canonical copy in
# aqueducts-ai/threefold). Make this job a required status check in the branch protection / org ruleset.
name: AI Gateway check

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-direct-llm-calls:
    name: No direct LLM calls
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Self-test the scanner (OpenAI, Anthropic, gateway fixtures)
        run: node scripts/check-direct-ai-calls.mjs --self-test
      # On PRs, use the BASE branch's scanner and baseline as the reference, so a PR can't weaken the
      # check by editing the scanner or growing the baseline. (First adoption: base has neither, so the
      # PR's own copies are used.)
      - name: Fetch the base branch's scanner and baseline (PRs only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:scripts/check-direct-ai-calls.baseline.json > "$RUNNER_TEMP/base-baseline.json" 2>/dev/null || rm -f "$RUNNER_TEMP/base-baseline.json"
          git show FETCH_HEAD:scripts/check-direct-ai-calls.mjs > "$RUNNER_TEMP/base-scanner.mjs" 2>/dev/null || rm -f "$RUNNER_TEMP/base-scanner.mjs"
      - name: Check for direct LLM calls (and that the baseline did not grow)
        run: |
          SCANNER=scripts/check-direct-ai-calls.mjs
          [ -f "$RUNNER_TEMP/base-scanner.mjs" ] && SCANNER="$RUNNER_TEMP/base-scanner.mjs"
          node scripts/check-direct-ai-calls.mjs --base "$RUNNER_TEMP/base-baseline.json"
          if [ "$SCANNER" != scripts/check-direct-ai-calls.mjs ]; then
            echo "Re-running the base branch's scanner against this PR:"
            node "$SCANNER" --base "$RUNNER_TEMP/base-baseline.json"
          fi
